<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino's Word Treasure Hunt．Feature Tour</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b1d3a;font-family:"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC","Microsoft JhengHei",system-ui,sans-serif;color:#3d2a4d}
button{font-family:inherit;cursor:pointer;border:0}
#play{position:fixed;inset:0;overflow:hidden}
#blur{position:absolute;inset:0;background:center/cover no-repeat}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:center/100% 100% no-repeat}
#scene{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .7s}
#scene.on{opacity:1}
#frame{position:absolute;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#frame img{max-width:100%;max-height:100%;border-radius:1.2vmin;box-shadow:0 .6vmin 1.6vmin rgba(80,30,90,.25);animation:popin .6s ease}
@keyframes popin{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.chr{position:absolute;bottom:0;transform-origin:50% 100%;will-change:transform}
.chr img{height:100%;display:block}
.chr.idle{animation:breathe 3s ease-in-out infinite}
.chr.talk{animation:talk .5s ease-in-out infinite alternate}
.chr.dim{opacity:.92}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.985)}}
@keyframes talk{from{transform:translateY(0) scale(1.03)}to{transform:translateY(-3%) scale(1.06)}}
.chr.hop{animation:hop .45s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14%)}100%{transform:translateY(0)}}
#sub{position:absolute;text-align:center;font-weight:900;color:#fff;line-height:1.35;
 text-shadow:0 0 .35em #4a1d5c,0 0 .35em #4a1d5c,0 .1em .15em #4a1d5c,0 0 .7em rgba(74,29,92,.7)}
#sub .tr,#ttl .tr{display:none;font-size:.62em;font-weight:800;color:#fff6a8;margin-top:.25em;line-height:1.3}body.tron #sub .tr{display:block}body.tron #ttl .tr{display:block;font-size:.55em;white-space:normal}
#sub b{display:block;font-size:.62em;letter-spacing:.05em}
#sub b.L{color:#ffb6dc}#sub b.D{color:#a8f0c6}#sub b.B{color:#ffe08a}
#ttl{position:absolute;left:2%;top:2.5%;font-weight:900;color:#fff;text-shadow:0 0 .3em #8a2d76,0 .08em .1em #8a2d76;transition:all .6s ease;white-space:nowrap}
#ttl small{display:block;font-size:.55em;color:#ffe08a}
#ttl.big{left:50%;top:40%;transform:translate(-50%,-50%) scale(1.9);text-align:center;width:max-content;text-wrap:balance;word-break:keep-all}#ttl.big .tr{width:0;min-width:100%;word-break:normal}
#ctl{position:absolute;right:1.5%;bottom:2%;display:flex;gap:.8vmin;opacity:.75;z-index:5}
#ctl button{width:6vmin;height:6vmin;min-width:34px;min-height:34px;border-radius:50%;background:rgba(255,255,255,.85);font-size:2.6vmin;color:#7a3d8c;box-shadow:0 .3vmin .8vmin rgba(0,0,0,.2)}
#ctl button.on{background:#ffe08a;color:#a0461a}
#ctl button.wide{width:auto;border-radius:99px;padding:0 1.6vmin;font-weight:800}
#dots{position:absolute;left:50%;bottom:.8%;transform:translateX(-50%);display:flex;gap:.6vmin;z-index:5}
#dots i{width:1.2vmin;height:1.2vmin;min-width:6px;min-height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
#dots i.on{background:#ff8cc6;transform:scale(1.3)}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4%;background:center/cover no-repeat}
#start h1{margin:0;font-size:min(7vw,9vh);color:#fff;font-weight:900;text-shadow:0 0 .2em #c2508a,0 .06em .08em #8a2d76;text-align:center;line-height:1.15}
#start h2{margin:.2em 0 0;font-size:min(3.4vw,4.4vh);color:#fff6a8;text-shadow:0 0 .3em #8a2d76}
#start .bt{display:flex;gap:2vmin;margin-top:auto;margin-bottom:5%}
.big{font-size:min(3.4vw,4vh);font-weight:900;color:#fff;padding:1.4vmin 4vmin;border-radius:99px;background:linear-gradient(#ffb44d,#ff7a2f);box-shadow:0 .7vmin 0 #d85a1a,0 1.2vmin 2vmin rgba(0,0,0,.25)}
.big.pk{background:linear-gradient(#ff9ccf,#ff5fa8);box-shadow:0 .7vmin 0 #c2408a,0 1.2vmin 2vmin rgba(0,0,0,.25)}
/* reading */
#read{display:none;min-height:100%;background:linear-gradient(#ffe9f5,#e9f6ff);padding:0 0 60px}
body.reading #play{display:none}body.reading #read{display:block}body.reading{background:#ffe9f5}
.rhead{position:relative;width:100%;aspect-ratio:16/9;max-height:70vh;background:center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3%}
.rhead h1{margin:0;font-size:min(7vw,52px);color:#fff;text-shadow:0 0 .2em #c2508a,0 .06em .08em #8a2d76;text-align:center}
.rhead h2{margin:.2em 0;font-size:min(4vw,26px);color:#fff6a8;text-shadow:0 0 .3em #8a2d76}
.rbar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:10px;padding:8px;background:rgba(255,233,245,.92)}
.rbar .big{font-size:16px;padding:8px 18px}
.seg{max-width:980px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:26px;box-shadow:0 8px 24px rgba(160,80,140,.15);border:4px solid #ffd1e8;padding:16px 18px;overflow:hidden}
.card h3{margin:0 0 12px;font-size:22px;color:#e2559b;display:flex;align-items:center;gap:10px}
.card h3 span.n{white-space:nowrap;flex:none;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;border-radius:99px;padding:2px 12px;font-size:15px}
.card h3 button{margin-left:auto;flex:none;white-space:nowrap;background:#fff3fa;border:2px solid #ffd1e8;border-radius:99px;padding:4px 12px;font-size:14px;color:#c2408a;font-weight:800}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px;margin-bottom:12px}
.pics img{width:100%;border-radius:14px;border:3px solid #fff0c8;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.ln.D{flex-direction:row-reverse}
.ln .av{width:64px;height:76px;flex:none;object-fit:contain}
.ln .bb{position:relative;border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.6;max-width:78%;cursor:pointer}
.ln.L .bb{background:#ffe6f2;border:2px solid #ffb6dc}.ln.D .bb{background:#e2f8ea;border:2px solid #a8e6bf}.ln.B .bb{background:#fff4cf;border:2px solid #ffd77a}
.ln .bb b{display:block;font-size:13px;color:#a05a8c}
.ln .bb .t{display:none;font-size:15px;color:#6a4f7a;margin-top:6px;padding-top:5px;border-top:1.5px dashed rgba(160,90,140,.35)}body.tron .ln .bb .t{display:block}
.ln .bb .t i,.card h3 em i{font-style:normal;cursor:pointer;margin-left:6px}.card h3 em{display:none;font-style:normal;font-size:14px;color:#a05a8c;font-weight:700}body.tron .card h3 em{display:block}
.rbar .big.on{background:linear-gradient(#ffe08a,#ffb44d)}
.ln .bb.say{outline:3px solid #ff8cc6}
@media screen and (max-width:600px){.card{padding:14px 12px}.card h3{flex-wrap:wrap;font-size:20px;row-gap:8px}.card h3>span:not(.n){flex:1 1 0;min-width:55%}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html{background:#fff!important}
 body,body.reading{background:#fff}#play{display:none!important}#read{display:block!important;background:#fff;padding:0}
 .rbar,.card h3 button{display:none!important}
 .rhead{max-height:none;height:180mm;aspect-ratio:auto;page-break-after:always;border-radius:0}
 .seg{max-width:none;margin:0;padding:0;page-break-after:always;break-inside:avoid}
 .card{box-shadow:none;border-width:3px;display:grid;grid-template-columns:52% 1fr;gap:12px;align-items:start}
 .card h3{grid-column:1/3}
 .pics{grid-template-columns:1fr 1fr;margin:0}.pics img:only-child{grid-column:1/3}
 .ln .bb .t{display:block!important;font-size:10.5px;margin-top:2px;padding-top:2px;line-height:1.35}.ln .bb .t i,.card h3 em i{display:none}.card h3 em{display:block!important}
 .ln{margin:3px 0}.ln .bb{line-height:1.45!important;font-size:12px;padding:7px 12px;max-width:86%}.ln .av{width:48px;height:58px}
 .card{align-content:start}.card h3{font-size:24px}
}
</style>
</head>

<script>
const D={"ui":{"lang":"en-US","tlang":"zh-CN","trl":"中文翻译","title":"Dino's Word Treasure Hunt","sub":"Feature Tour","watch":"Watch","read":"Read","anim":"Animation","readseg":"Read this part","part":"Part {n}","L":"Lily","D":"Dino","B":"Lily & Dino","end":"Let's go on a treasure hunt!","again":"Watch again"},"segs":[{"t":"The Big Treasure in the Park","tt":"乐园里的大宝藏","pics":["I01"],"lines":[{"w":"L","p":"l_ask","t":"Dino, Dino! I heard there's a super big treasure hidden in the Dinosaur Park. Is it true?","tr":"迪诺，迪诺！我听说恐龙乐园里藏了一个超级大宝藏，是真的吗？","i":0,"c":null},{"w":"D","p":"d_intro","t":"It's true! The treasure is called Dino's Word Treasure Hunt! More than 3,600 Chinese characters are hidden inside!","tr":"是真的！这个宝藏叫做“迪诺文字大寻宝”！里面藏着三千六百多个中文字！","i":0,"c":null},{"w":"L","p":"l_wow","t":"Over 3,600 characters? Wow! How do we find them all?","tr":"三千六百多个字？哇！要怎么把它们全部找出来？","i":0,"c":null},{"w":"D","p":"d_point","t":"Don't worry. I'll take you on a treasure hunt, one park at a time. Let's go!","tr":"别担心，我带你一座乐园一座乐园去寻宝。走吧！","i":0,"c":null}]},{"t":"Nine Parks, Nine Levels","tt":"九座乐园、九个级数","pics":["map"],"lines":[{"w":"L","p":"l_wow","t":"Wow, what a beautiful treasure map!","tr":"哇，好漂亮的藏宝地图！","i":0,"c":null},{"w":"D","p":"d_mag","t":"From Grade 1 to Grade 9, there are nine volumes, and each volume is a theme park: Candy Sweet Park, Ocean Water Park, Forest Adventure Park, Space Star Park, Snow Castle Park, Jungle Volcano Park, Desert Pyramid Park, Pirate Treasure Island, and Future Tech City!","tr":"从一年级到九年级，一共九集，每一集都是一座主题乐园：糖果甜心乐园、海洋水上乐园、森林探险乐园、太空星际乐园、冰雪城堡乐园、丛林火山乐园、沙漠金字塔乐园、海盗宝藏岛，还有未来科技城！","i":0,"c":null},{"w":"L","p":"l_clap","t":"From candy all the way to the future. It's like a trip around the world!","tr":"从糖果一路到未来，好像在环游世界！","i":0,"c":null},{"w":"D","p":"d_proud","t":"And the higher you go, the harder the characters get. You'll get better and better, level by level!","tr":"而且越往上走，字就越难。你会一级一级变得越来越厉害！","i":0,"c":null}]},{"t":"Every Character Is a Treasure","tt":"每个字都是一件宝物","pics":["char_info","char_words","poly"],"lines":[{"w":"L","p":"l_think","t":"What happens when I find a character?","tr":"找到一个字以后会怎么样？","i":0,"c":null},{"w":"D","p":"d_book","t":"Every character is a treasure! Open it up and you'll find everything: pinyin, the radical, the stroke count, an English meaning, words, idioms and example sentences.","tr":"每个字都是一件宝物！打开来，什么都有：拼音和拼音、部首、笔画数、英文意思、词语、成语和例句。","i":0,"c":null},{"w":"L","p":"l_wow","t":"That's a lot! Do I have to read it all by myself?","tr":"好多哦！全部都要我自己读吗？","i":1,"c":null},{"w":"D","p":"d_good","t":"Nope! Every part has a little speaker. Tap it to hear it in Chinese or in English, or tap Read All to hear everything.","tr":"不用！每个地方都有小喇叭，按一下就能用中文或英文听，或者按“全部朗读”听全部内容。","i":1,"c":null},{"w":"L","p":"l_think","t":"What if a character has more than one pronunciation?","tr":"如果一个字有好几个读音呢？","i":2,"c":null},{"w":"D","p":"d_point","t":"Those are sorted out for you too. Each pronunciation has its own words and example sentence.","tr":"这些也帮你整理好了。每一种读音都有自己的词语和例句。","i":2,"c":null}]},{"t":"Watch, Trace, Write","tt":"看、描、写三步骤","pics":["char_top"],"lines":[{"w":"L","p":"l_think","t":"But I'm afraid of writing the strokes in the wrong order...","tr":"可是我怕笔顺写错……","i":0,"c":null},{"w":"D","p":"d_pencil","t":"No problem! First, watch the stroke-order animation, stroke by stroke. Then trace the light character with your finger. Finally, write it from memory. After three mistakes, you get a hint!","tr":"没问题！先看笔顺动画，一笔一笔来。再用手指描淡淡的字。最后凭记忆写出来。错三次就会给你提示！","i":0,"c":null},{"w":"L","p":"l_clap","t":"Watch, trace, write. Three steps, and I'll remember it!","tr":"看、描、写，三个步骤，我就记住了！","i":0,"c":null},{"w":"D","p":"d_good","t":"And it counts the strokes for you as you write, in Chinese or in English!","tr":"而且你写的时候，它会用中文或英文帮你数笔画！","i":0,"c":null}]},{"t":"Learn Chinese and English Together","tt":"中英文一起学","pics":["SBS","I07"],"lines":[{"w":"L","p":"l_wow","t":"Is this app good for people who don't speak Chinese?","tr":"这个App适合不会说中文的人吗？","i":0,"c":null},{"w":"D","p":"d_point","t":"It's perfect for them! Every character has an English meaning, and every word and example sentence has an English translation, read aloud in English too.","tr":"非常适合！每个字都有英文意思，每个词语和例句都有英文翻译，也会用英文念出来。","i":0,"c":null},{"w":"L","p":"l_yay","t":"So you understand the meaning in English, then learn to say it in Chinese!","tr":"所以先用英文懂意思，再学用中文说出来！","i":0,"c":null},{"w":"D","p":"d_proud","t":"Exactly! Learning Chinese is easy for friends from all over the world. One app, two languages, learning together!","tr":"没错！世界各地的朋友学中文都很容易。一个App，两种语言，一起学！","i":1,"c":null}]},{"t":"The Practice Room","tt":"练习室","pics":["practice"],"lines":[{"w":"L","p":"l_ask","t":"After I learn, how do I know I really remember?","tr":"学完以后，我怎么知道自己真的记住了？","i":0,"c":null},{"w":"D","p":"d_intro","t":"Go to the Practice Room! The coach blows the whistle, and five challenges are waiting: Listen and Pick, Radical Quiz, Stroke Count, Fill the Gap, and Dictation.","tr":"到练习室去！教练吹哨子，五个挑战等着你：听音辨字、部首考验、笔画数、词句填空和听写。","i":0,"c":null},{"w":"L","p":"l_think","t":"What if I keep missing the same character?","tr":"如果我一直答错同一个字呢？","i":0,"c":null},{"w":"D","p":"d_mag","t":"Practice Weak Characters finds the ones you often miss and helps you practice them!","tr":"“弱点字特训”会找出你常错的字，帮你练习！","i":0,"c":null}]},{"t":"Fifty-Four Theme Games","tt":"五十四个主题游戏","pics":["park","g_claw","g_dolphin","g_rocket","g_snowball","g_chest"],"lines":[{"w":"L","p":"l_ask","t":"What can we play in the parks?","tr":"我们在乐园里可以玩什么？","i":0,"c":null},{"w":"D","p":"d_intro","t":"Every park has six theme games. Nine parks, so that's fifty-four games!","tr":"每座乐园都有六个主题游戏。九座乐园，所以一共五十四个游戏！","i":0,"c":null},{"w":"L","p":"l_wow","t":"Fifty-four?!","tr":"五十四个？！","i":0,"c":null},{"w":"D","p":"d_point","t":"Grab radicals with the claw machine in Candy Park, jump through hoops with the dolphins to read pinyin, launch a rocket into space, have a snowball fight at the Snow Castle, and crack the treasure chest code on Pirate Island. Every game has its own story!","tr":"在糖果乐园用夹娃娃机夹部首、跟海豚一起跳圈认字、把火箭发射到太空、在冰雪城堡打雪球大战，还有在海盗岛破解藏宝箱密码。每个游戏都有自己的故事！","i":1,"c":["g_claw","g_dolphin","g_rocket","g_snowball","g_chest"]},{"w":"L","p":"l_yay","t":"Play and practice at the same time. I'll never get bored!","tr":"一边玩一边练习，我永远都不会腻！","i":5,"c":null}]},{"t":"Say It Out Loud","tt":"开口念出来","pics":["g_egg","g_conch","g_aurora"],"lines":[{"w":"L","p":"l_wow","t":"Hey, why does this game have a microphone?","tr":"咦，这个游戏为什么有麦克风？","i":0,"c":null},{"w":"D","p":"d_mic","t":"Every park has a speaking game! Read out loud into the microphone. Get it right, and a baby dinosaur hatches, the conch carries your voice to your sea friends, and the aurora makes your wish come true!","tr":"每座乐园都有一个说话游戏！对着麦克风大声念。念对了，恐龙宝宝就会孵出来、海螺会把你的声音传给海洋朋友，极光还会实现你的愿望！","i":0,"c":["g_egg","g_conch","g_aurora"]},{"w":"L","p":"l_clap","t":"So I can practice speaking and pronunciation too!","tr":"原来我也可以练习说话和发音！","i":2,"c":null}]},{"t":"A Full Test","tt":"完整的测验","pics":["test_intro","test_q","test_w","cert"],"lines":[{"w":"L","p":"l_ask","t":"How can I find out how much I've really learned?","tr":"我要怎么知道自己真正学了多少？","i":0,"c":null},{"w":"D","p":"d_intro","t":"Every volume has a full test! Twenty-five questions: ten multiple-choice questions with four answers, ten fill-in-the-blank questions, and five writing questions. The questions are random every time.","tr":"每一集都有完整的测验！二十五题：十题四选一选择题、十题填充题和五题写字题。每次题目都是随机的。","i":1,"c":["test_q","test_w"]},{"w":"L","p":"l_think","t":"Can I write my name on it?","tr":"我可以写上我的名字吗？","i":0,"c":null},{"w":"D","p":"d_good","t":"Of course! After the test, you get a certificate that says Lily's Score, with a gold, silver or bronze medal!","tr":"当然！考完会拿到一张写着“莉莉的成绩”的奖状，还有金牌、银牌或铜牌！","i":3,"c":null},{"w":"L","p":"l_yay","t":"And there's a Big Test that mixes Volumes 1 to 9. I can challenge my best self!","tr":"还有一个把一到九集混在一起的总测验。我可以挑战最强的自己！","i":3,"c":null}]},{"t":"No Mistake Left Behind","tt":"错的字，一个都不漏","pics":["records","detail","mistakes"],"lines":[{"w":"L","p":"l_think","t":"What about the questions I got wrong?","tr":"我答错的题目怎么办？","i":0,"c":null},{"w":"D","p":"d_mag","t":"Your last twenty tests are saved. Tap one to see every question, your answer and the right answer.","tr":"你最近二十次的测验都会保存。按一下就能看到每一题、你的答案和正确答案。","i":1,"c":null},{"w":"L","p":"l_ask","t":"And the characters I missed?","tr":"那我错的字呢？","i":2,"c":null},{"w":"D","p":"d_point","t":"They all go into the Mistake Collection! Tap a character to go straight back and learn it again. No missed character gets left behind!","tr":"全部都会收进“错误合集”！按一下那个字，就能直接回去重新学。错过的字，一个都不会被丢下！","i":2,"c":null}]},{"t":"My Report","tt":"成长观测站","pics":["report","radar"],"lines":[{"w":"L","p":"l_ask","t":"Mom and Dad want to know how I'm doing too!","tr":"爸爸妈妈也想知道我学得怎么样！","i":0,"c":null},{"w":"D","p":"d_book","t":"My Report has a five-skill radar chart: sounds, radicals, shapes and meaning, words and sentences, and writing. You can see your strengths and what to work on at a glance.","tr":"成长观测站有五力雷达图：字音、部首、字形和字义、词句，还有写字。你的强项和要加强的地方，一看就知道。","i":1,"c":null},{"w":"L","p":"l_giggle","t":"Plus the characters I've learned, park stars and a leaderboard. It's like collecting treasure!","tr":"还有我学会的字、乐园星星和排行榜。好像在收集宝物！","i":0,"c":null}]},{"t":"Learn Anytime, Anywhere","tt":"随时随地都能学","pics":["DEV"],"lines":[{"w":"L","p":"l_think","t":"Can I use it on my phone?","tr":"我可以用手机玩吗？","i":0,"c":null},{"w":"D","p":"d_good","t":"Phones, tablets and computers all work! Hold it upright or sideways, and the screen changes to fit, full of the Dinosaur Park.","tr":"手机、平板和电脑都可以！直着拿或横着拿，画面都会自动调整，满满都是恐龙乐园。","i":0,"c":null}]},{"t":"Listen, Speak, Read and Write","tt":"听说读写，全部学会","pics":["I11","I08"],"lines":[{"w":"L","p":"l_yay","t":"Dino, I get it! Listening, speaking, reading and writing. I can learn it all here!","tr":"迪诺，我懂了！听、说、读、写，我在这里全部都能学会！","i":0,"c":null},{"w":"D","p":"d_proud","t":"That's right! More than 3,600 characters, nine parks, fifty-four games, full tests, and Chinese and English t const AUD={"en-US|N|The Big Treasure in the Park":"audio/2b2240f95df4.mp3","zh-CN|N|乐园里的大宝藏":"audio/491e28f9a374.mp3","en-US|L|Dino, Dino! I heard there's a super big treasure hidden in the Dinosaur Park. Is it true?":"audio/f97f4f1be96f.mp3","zh-CN|L|迪诺，迪诺！我听说恐龙乐园里藏了一个超级大宝藏，是真的吗？":"audio/0636f934d12e.mp3","en-US|D|It's true! The treasure is called Dino's Word Treasure Hunt! More than 3,600 Chinese characters are hidden inside!":"audio/8afc12eb65b6.mp3","zh-CN|D|是真的！这个宝藏叫做“迪诺文字大寻宝”！里面藏着三千六百多个中文字！":"audio/e8adfe462c26.mp3","en-US|L|Over 3,600 characters? Wow! How do we find them all?":"audio/5e237e26fb8d.mp3","zh-CN|L|三千六百多个字？哇！要怎么把它们全部找出来？":"audio/f0e3d6eead25.mp3","en-US|D|Don't worry. I'll take you on a treasure hunt, one park at a time. Let's go!":"audio/c955c2b34791.mp3","zh-CN|D|别担心，我带你一座乐园一座乐园去寻宝。走吧！":"audio/d3f128495bab.mp3","en-US|N|Nine Parks, Nine Levels":"audio/a63bae7a607b.mp3","zh-CN|N|九座乐园、九个级数":"audio/eeae8f5f85ee.mp3","en-US|L|Wow, what a beautiful treasure map!":"audio/36f1b4231de0.mp3","zh-CN|L|哇，好漂亮的藏宝地图！":"audio/76c4fe14860f.mp3","en-US|D|From Grade 1 to Grade 9, there are nine volumes, and each volume is a theme park: Candy Sweet Park, Ocean Water Park, Forest Adventure Park, Space Star Park, Snow Castle Park, Jungle Volcano Park, Desert Pyramid Park, Pirate Treasure Island, and Future Tech City!":"audio/6bc603024be8.mp3","zh-CN|D|从一年级到九年级，一共九集，每一集都是一座主题乐园：糖果甜心乐园、海洋水上乐园、森林探险乐园、太空星际乐园、冰雪城堡乐园、丛林火山乐园、沙漠金字塔乐园、海盗宝藏岛，还有未来科技城！":"audio/9e176123175b.mp3","en-US|L|From candy all the way to the future. It's like a trip around the world!":"audio/9213f60760ec.mp3","zh-CN|L|从糖果一路到未来，好像在环游世界！":"audio/610b3f5943e9.mp3","en-US|D|And the higher you go, the harder the characters get. You'll get better and better, level by level!":"audio/c506839239a7.mp3","zh-CN|D|而且越往上走，字就越难。你会一级一级变得越来越厉害！":"audio/08dcc8df8677.mp3","en-US|N|Every Character Is a Treasure":"audio/ad33f09088dc.mp3","zh-CN|N|每个字都是一件宝物":"audio/6dd19ccf1213.mp3","en-US|L|What happens when I find a character?":"audio/0c610eea4734.mp3","zh-CN|L|找到一个字以后会怎么样？":"audio/9600b9eda077.mp3","en-US|D|Every character is a treasure! Open it up and you'll find everything: pinyin, the radical, the stroke count, an English meaning, words, idioms and example sentences.":"audio/b54c0b71741c.mp3","zh-CN|D|每个字都是一件宝物！打开来，什么都有：拼音和拼音、部首、笔画数、英文意思、词语、成语和例句。":"audio/61f230dcf755.mp3","en-US|L|That's a lot! Do I have to read it all by myself?":"audio/e6d13d4987e1.mp3","zh-CN|L|好多哦！全部都要我自己读吗？":"audio/d20723bc3e59.mp3","en-US|D|Nope! Every part has a little speaker. Tap it to hear it in Chinese or in English, or tap Read All to hear everything.":"audio/443b6477fe92.mp3","zh-CN|D|不用！每个地方都有小喇叭，按一下就能用中文或英文听，或者按“全部朗读”听全部内容。":"audio/798aec81129c.mp3","en-US|L|What if a character has more than one pronunciation?":"audio/18fed008fc30.mp3","zh-CN|L|如果一个字有好几个读音呢？":"audio/529d2fd72c37.mp3","en-US|D|Those are sorted out for you too. Each pronunciation has its own words and example sentence.":"audio/622b886738c9.mp3","zh-CN|D|这些也帮你整理好了。每一种读音都有自己的词语和例句。":"audio/908d01068286.mp3","en-US|N|Watch, Trace, Write":"audio/eee63aab8c3b.mp3","zh-CN|N|看、描、写三步骤":"audio/21bb2bad519a.mp3","en-US|L|But I'm afraid of writing the strokes in the wrong order...":"audio/1ee781beb5e2.mp3","zh-CN|L|可是我怕笔顺写错……":"audio/f31207f5689d.mp3","en-US|D|No problem! First, watch the stroke-order animation, stroke by stroke. Then trace the light character with your finger. Finally, write it from memory. After three mistakes, you get a hint!":"audio/ec641581f832.mp3","zh-CN|D|没问题！先看笔顺动画，一笔一笔来。再用手指描淡淡的字。最后凭记忆写出来。错三次就会给你提示！":"audio/f3339542c5f2.mp3","en-US|L|Watch, trace, write. Three steps, and I'll remember it!":"audio/dfae0cdba33a.mp3","zh-CN|L|看、描、写，三个步骤，我就记住了！":"audio/2e2ca2e4565f.mp3","en-US|D|And it counts the strokes for you as you write, in Chinese or in English!":"audio/84b7ec1165ce.mp3","zh-CN|D|而且你写的时候，它会用中文或英文帮你数笔画！":"audio/313099c95582.mp3","en-US|N|Learn Chinese and English Together":"audio/771d9b563bc0.mp3","zh-CN|N|中英文一起学": const AEL=new Audio();let acur=null;AEL.preload="auto";
const PRE=new Set();function preSeg(n){const sg=SEGS[n];if(!sg||PRE.has(n))return;PRE.add(n);[[U.lang,"N",sg.t]].concat(sg.lines.map(l=>[U.lang,l.w,l.t])).forEach(k=>{const u=AUD[k.join("|")];if(u)try{fetch(u).catch(()=>{})}catch(e){}})}
function stopAll(){if(acur){const f=acur;acur=null;try{AEL.pause()}catch(e){}f()}}
function playA(b){return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;if(acur===fin)acur=null;res()};
 if(acur){const f=acur;acur=null;f()}acur=fin;AEL.onended=fin;AEL.onerror=fin;AEL.src=b;
 try{const p=AEL.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==="AbortError")return;fin()})}catch(e){fin()}})}
function quiet(t,ms){console.warn("[預錄語音] 沒有音檔："+t);return new Promise(r=>setTimeout(r,ms))}
function sayT(t,who){stopAll();const a=AUD[U.tlang+"|"+(who||"N")+"|"+t];return a?playA(a):quiet(t,t.length*(U.tlang==="en-US"?72:260)+700)}
function say(t,who){const a=AUD[U.lang+"|"+who+"|"+t];return a?playA(a):quiet(t,(ZH?t.length*260:t.length*72)+700)}
function chunks(t){const parts=JA?t.match(/[^、。！？…]+[、。！？…」』]*/g)||[t]:ZH?t.match(/[^，。！？；：…]+[，。！？；：…」』]*/g)||[t]:t.match(/(?:[^,.!?;:]|,(?=[0-9]))+[,.!?;:]*["”]?/g)||[t];
 const out=[];const MX=JA?26:ZH?20:72;let cur="";for(let p of parts){p=p.trim();if(!p)continue;if(cur&&(cur+p).length>MX){out.push(cur);cur=p}else cur=cur?(ZH?cur+p:cur+" "+p):p}if(cur)out.push(cur);return out}

const TBR={"ランドの大きな宝物":"ランドの|大きな宝物","一つ一つの字が宝物":"一つ一つの字が|宝物","中国語と日本語をいっしょに":"中国語と日本語を|いっしょに","五十四のテーマゲーム":"五十四の|テーマゲーム","声に出して読もう":"声に出して|読もう","本格的なテスト":"本格的な|テスト","まちがえた字は一つものがさない":"まちがえた字は|一つものがさない","いつでもどこでも学べる":"いつでもどこでも|学べる"};function ttlH(t){return(TBR[t]||t).split("|").join("<wbr>")}
function fitTtl(){const t=$("ttl"),s=t.style;s.transition="none";s.whiteSpace=s.maxWidth="";if(t.classList.contains("big")){const W=$("stage").clientWidth*0.94;let k=Math.min(1.9,W/t.offsetWidth);if(k<1.45){k=1.45;s.whiteSpace="normal";s.maxWidth=W/k+"px";if(t.scrollWidth>t.clientWidth+1){s.whiteSpace=s.maxWidth="";k=W/t.offsetWidth}}s.transform="translate(-50%,-50%) scale("+k*0.85+")";void t.offsetWidth;s.transition="";s.transform="translate(-50%,-50%) scale("+k+")"}else{s.transform="";const W=$("stage").clientWidth*0.96;if(t.offsetWidth>W){s.whiteSpace="normal";s.maxWidth=W+"px"}void t.offsetWidth;s.transition=""}}
let LAND=true;
function layout(){const W=innerWidth,H=innerHeight;LAND=W>=H;const ar=LAND?16/9:9/16;let w=W,h=W/ar;if(h>H){h=H;w=H*ar}
 const st=$("stage");st.style.width=w+"px";st.style.height=h+"px";st.style.backgroundImage=`url(${IMG[LAND?"I05":"I06"]})`;$("blur").style.backgroundImage=`url(${IMG[LAND?"I05b":"I06b"]})`;
 const f=$("frame").style;if(LAND){Object.assign(f,{left:"42%",top:"28.6%",width:"43%",height:"40%"})}else{Object.assign(f,{left:"16%",top:"25.6%",width:"68%",height:"26.8%"})}
 const L=$("cL").style,Dd=$("cD").style;
 if(LAND){Object.assign(L,{left:"2%",height:"46%",bottom:"5%"});Object.assign(Dd,{left:"19%",height:"48%",bottom:"4%"})}else{Object.assign(L,{left:"4%",height:"25%",bottom:"3%"});Object.assign(Dd,{left:"50%",height:"26%",bottom:"2.5%"})}
 const s=$("sub").style;const fs=(LAND?h*0.052:w*0.062);s.fontSize=fs+"px";
 if(LAND)Object.assign(s,{left:"37%",right:"2%",top:"auto",bottom:"7%"});else Object.assign(s,{left:"4%",right:"4%",top:"55%",bottom:"auto"});
 $("ttl").style.fontSize=(LAND?h*0.042:w*0.05)+"px";fitTtl();fitSub();

 setScene(curScene)}

const SUBMIN=0.6;function fitSub(){const s=$("sub"),st=$("stage"),H=st.clientHeight,W=st.clientWidth;if(!H)return;const base=LAND?H*0.052:W*0.062;let lim;if(LAND){const cb=H-$("ctl").offsetTop+H*0.012;s.style.bottom=cb+"px";lim=H-cb-H*0.70}else{s.style.top="53.4%";lim=H*(0.715-0.534)}let k=1;s.style.fontSize=base+"px";while(s.offsetHeight>lim&&k>SUBMIN+0.001){k=Math.max(SUBMIN,k-0.04);s.style.fontSize=base*k+"px"}}
