<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迪诺文字大寻宝．特色介绍</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b1d3a;font-family:"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC","Microsoft JhengHei",system-ui,sans-serif;color:#3d2a4d}
button{font-family:inherit;cursor:pointer;border:0}
#play{position:fixed;inset:0;overflow:hidden}
#blur{position:absolute;inset:0;background:center/cover no-repeat}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:center/100% 100% no-repeat}
#scene{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .7s}
#scene.on{opacity:1}
#frame{position:absolute;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#frame img{max-width:100%;max-height:100%;border-radius:1.2vmin;box-shadow:0 .6vmin 1.6vmin rgba(80,30,90,.25);animation:popin .6s ease}
@keyframes popin{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.chr{position:absolute;bottom:0;transform-origin:50% 100%;will-change:transform}
.chr img{height:100%;display:block}
.chr.idle{animation:breathe 3s ease-in-out infinite}
.chr.talk{animation:talk .5s ease-in-out infinite alternate}
.chr.dim{opacity:.92}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.985)}}
@keyframes talk{from{transform:translateY(0) scale(1.03)}to{transform:translateY(-3%) scale(1.06)}}
.chr.hop{animation:hop .45s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14%)}100%{transform:translateY(0)}}
#sub{position:absolute;text-align:center;font-weight:900;color:#fff;line-height:1.35;
 text-shadow:0 0 .35em #4a1d5c,0 0 .35em #4a1d5c,0 .1em .15em #4a1d5c,0 0 .7em rgba(74,29,92,.7)}
#sub .tr,#ttl .tr{display:none;font-size:.62em;font-weight:800;color:#fff6a8;margin-top:.25em;line-height:1.3}body.tron #sub .tr{display:block}body.tron #ttl .tr{display:block;font-size:.55em;white-space:normal}
#sub b{display:block;font-size:.62em;letter-spacing:.05em}
#sub b.L{color:#ffb6dc}#sub b.D{color:#a8f0c6}#sub b.B{color:#ffe08a}
#ttl{position:absolute;left:2%;top:2.5%;font-weight:900;color:#fff;text-shadow:0 0 .3em #8a2d76,0 .08em .1em #8a2d76;transition:all .6s ease;white-space:nowrap}
#ttl small{display:block;font-size:.55em;color:#ffe08a}
#ttl.big{left:50%;top:40%;transform:translate(-50%,-50%) scale(1.9);text-align:center}
#ctl{position:absolute;right:1.5%;bottom:2%;display:flex;gap:.8vmin;opacity:.75;z-index:5}
#ctl button{width:6vmin;height:6vmin;min-width:34px;min-height:34px;border-radius:50%;background:rgba(255,255,255,.85);font-size:2.6vmin;color:#7a3d8c;box-shadow:0 .3vmin .8vmin rgba(0,0,0,.2)}
#ctl button.on{background:#ffe08a;color:#a0461a}
#ctl button.wide{width:auto;border-radius:99px;padding:0 1.6vmin;font-weight:800}
#dots{position:absolute;left:50%;bottom:.8%;transform:translateX(-50%);display:flex;gap:.6vmin;z-index:5}
#dots i{width:1.2vmin;height:1.2vmin;min-width:6px;min-height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
#dots i.on{background:#ff8cc6;transform:scale(1.3)}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4%;background:center/cover no-repeat}
#start h1{margin:0;font-size:min(7vw,9vh);color:#fff;font-weight:900;text-shadow:0 0 .2em #c2508a,0 .06em .08em #8a2d76;text-align:center;line-height:1.15}
#start h2{margin:.2em 0 0;font-size:min(3.4vw,4.4vh);color:#fff6a8;text-shadow:0 0 .3em #8a2d76}
#start .bt{display:flex;gap:2vmin;margin-top:auto;margin-bottom:5%}
.big{font-size:min(3.4vw,4vh);font-weight:900;color:#fff;padding:1.4vmin 4vmin;border-radius:99px;background:linear-gradient(#ffb44d,#ff7a2f);box-shadow:0 .7vmin 0 #d85a1a,0 1.2vmin 2vmin rgba(0,0,0,.25)}
.big.pk{background:linear-gradient(#ff9ccf,#ff5fa8);box-shadow:0 .7vmin 0 #c2408a,0 1.2vmin 2vmin rgba(0,0,0,.25)}
/* reading */
#read{display:none;min-height:100%;background:linear-gradient(#ffe9f5,#e9f6ff);padding:0 0 60px}
body.reading #play{display:none}body.reading #read{display:block}body.reading{background:#ffe9f5}
.rhead{position:relative;width:100%;aspect-ratio:16/9;max-height:70vh;background:center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3%}
.rhead h1{margin:0;font-size:min(7vw,52px);color:#fff;text-shadow:0 0 .2em #c2508a,0 .06em .08em #8a2d76;text-align:center}
.rhead h2{margin:.2em 0;font-size:min(4vw,26px);color:#fff6a8;text-shadow:0 0 .3em #8a2d76}
.rbar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:10px;padding:8px;background:rgba(255,233,245,.92)}
.rbar .big{font-size:16px;padding:8px 18px}
.seg{max-width:980px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:26px;box-shadow:0 8px 24px rgba(160,80,140,.15);border:4px solid #ffd1e8;padding:16px 18px;overflow:hidden}
.card h3{margin:0 0 12px;font-size:22px;color:#e2559b;display:flex;align-items:center;gap:10px}
.card h3 span.n{white-space:nowrap;flex:none;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;border-radius:99px;padding:2px 12px;font-size:15px}
.card h3 button{margin-left:auto;flex:none;white-space:nowrap;background:#fff3fa;border:2px solid #ffd1e8;border-radius:99px;padding:4px 12px;font-size:14px;color:#c2408a;font-weight:800}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.pics img{width:100%;border-radius:14px;border:3px solid #fff0c8;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.ln.D{flex-direction:row-reverse}
.ln .av{width:64px;height:76px;flex:none;object-fit:contain}
.ln .bb{position:relative;border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.6;max-width:78%;cursor:pointer}
.ln.L .bb{background:#ffe6f2;border:2px solid #ffb6dc}.ln.D .bb{background:#e2f8ea;border:2px solid #a8e6bf}.ln.B .bb{background:#fff4cf;border:2px solid #ffd77a}
.ln .bb b{display:block;font-size:13px;color:#a05a8c}
.ln .bb .t{display:none;font-size:15px;color:#6a4f7a;margin-top:6px;padding-top:5px;border-top:1.5px dashed rgba(160,90,140,.35)}body.tron .ln .bb .t{display:block}
.ln .bb .t i,.card h3 em i{font-style:normal;cursor:pointer;margin-left:6px}.card h3 em{display:none;font-style:normal;font-size:14px;color:#a05a8c;font-weight:700}body.tron .card h3 em{display:block}
.rbar .big.on{background:linear-gradient(#ffe08a,#ffb44d)}
.ln .bb.say{outline:3px solid #ff8cc6}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html{background:#fff!important}
 body,body.reading{background:#fff}#play{display:none!important}#read{display:block!important;background:#fff;padding:0}
 .rbar,.card h3 button{display:none!important}
 .rhead{max-height:none;height:180mm;aspect-ratio:auto;page-break-after:always;border-radius:0}
 .seg{max-width:none;margin:0;padding:0;page-break-after:always;break-inside:avoid}
 .card{box-shadow:none;border-width:3px;display:grid;grid-template-columns:52% 1fr;gap:12px;align-items:start}
 .card h3{grid-column:1/3}
 .pics{grid-template-columns:1fr 1fr;margin:0}.pics img:only-child{grid-column:1/3}
 .ln .bb .t{display:block!important;font-size:10.5px;margin-top:2px;padding-top:2px;line-height:1.35}.ln .bb .t i,.card h3 em i{display:none}.card h3 em{display:block!important}
 .ln{margin:3px 0}.ln .bb{line-height:1.45!important;font-size:12px;padding:7px 12px;max-width:86%}.ln .av{width:48px;height:58px}
 .card{align-content:start}.card h3{font-size:24px}
}
</style>
</head>
<body>
<div id="play">
 <div id="blur"></div>
 <div id="stage">
  <div id="scene"></div>
  <div id="frame"></div>
  <div class="chr idle" id="cL"><img></div>
  <div class="chr idle" id="cD"><img></div>
  <div id="ttl"></div>
  <div id="sub"></div>
  <div id="dots"></div>
  <div id="ctl"><button id="bPrev">⏮</button><button id="bPlay">⏸</button><button id="bNext">⏭</button><button id="bTr" class="wide"></button><button id="bRead" class="wide"></button></div>
  <div id="start"><h1></h1><h2></h2><div class="bt"><button class="big" id="go"></button><button class="big pk" id="goRead"></button></div></div>
 </div>
</div>
<div id="read"></div>
<script>
const D={"ui":{"lang":"zh-CN","tlang":"en-US","trl":"English","title":"迪诺文字大寻宝","sub":"特色介绍","watch":"开始观看","read":"阅读版","anim":"动画版","readseg":"朗读这一段","part":"第{n}段","L":"莉莉","D":"迪诺","B":"莉莉、迪诺","end":"一起去寻宝吧！","again":"再看一次"},"segs":[{"t":"乐园里的大宝藏","tt":"The Big Treasure in the Park","pics":["I01"],"lines":[{"w":"L","p":"l_ask","t":"迪诺迪诺！听说恐龙乐园里藏了一个超级大宝藏，是真的吗？","tr":"Dino, Dino! I heard there's a super big treasure hidden in the Dinosaur Park. Is it true?","i":0,"c":null},{"w":"D","p":"d_intro","t":"是真的！这个宝藏就叫做“迪诺文字大寻宝”！里面藏着三千六百多个中文字哦！","tr":"It's true! The treasure is called Dino's Word Treasure Hunt! More than 3,600 Chinese characters are hidden inside!","i":0,"c":null},{"w":"L","p":"l_wow","t":"三千六百多个？哇，那要怎么找啊？","tr":"More than 3,600? Wow, how do we find them?","i":0,"c":null},{"w":"D","p":"d_point","t":"别担心，我带你一座乐园、一座乐园去寻宝！走吧！","tr":"Don't worry. I'll take you on a treasure hunt, one park at a time. Let's go!","i":0,"c":null}]},{"t":"九座乐园、九个级数","tt":"Nine Parks, Nine Levels","pics":["map"],"lines":[{"w":"L","p":"l_wow","t":"哇，这张藏宝地图好漂亮！","tr":"Wow, what a beautiful treasure map!","i":0,"c":null},{"w":"D","p":"d_mag","t":"从一年级到九年级，一共分成九集，每一集就是一座主题乐园：糖果甜心乐园、海洋水上乐园、森林探险乐园、太空星际乐园、冰雪城堡乐园、丛林火山乐园、沙漠金字塔乐园、海盗宝藏岛，还有未来科技城！","tr":"From Grade 1 to Grade 9, there are nine volumes, and each volume is a theme park: Candy Sweet Park, Ocean Water Park, Forest Adventure Park, Space Star Park, Snow Castle Park, Jungle Volcano Park, Desert Pyramid Park, Pirate Treasure Island, and Future Tech City!","i":0,"c":null},{"w":"L","p":"l_clap","t":"从糖果一路玩到未来科技，好像在环游世界耶！","tr":"From candy all the way to future tech. It's like a trip around the world!","i":0,"c":null},{"w":"D","p":"d_proud","t":"而且越往上走，字就越难，你会一级一级变得越来越厉害！","tr":"And the higher you go, the harder the characters get. You'll get better and better, level by level!","i":0,"c":null}]},{"t":"每个字都是一件宝物","tt":"Every Character Is a Treasure","pics":["char_info","char_words","poly"],"lines":[{"w":"L","p":"l_think","t":"那找到一个字以后呢？","tr":"What happens after I find a character?","i":0,"c":null},{"w":"D","p":"d_book","t":"每个字都是一件宝物！打开来看，里面什么都有：拼音、部首、笔画数、解释、词语、成语，还有例句。","tr":"Every character is a treasure! Open it up and everything is inside: pinyin, the radical, the stroke count, the meaning, words, idioms and example sentences.","i":0,"c":null},{"w":"L","p":"l_wow","t":"这么多，全部都要自己读吗？","tr":"So much! Do I have to read it all by myself?","i":1,"c":null},{"w":"D","p":"d_good","t":"不用！每个地方都有小喇叭，一按就念给你听，还有“全部朗读”，从头念到尾。","tr":"No! Every part has a little speaker. Tap it and it reads to you. There's also Read All, from beginning to end.","i":1,"c":null},{"w":"L","p":"l_think","t":"那一个字有好几个读音怎么办？","tr":"What if one character has several pronunciations?","i":2,"c":null},{"w":"D","p":"d_point","t":"多音字也帮你整理好了，每一种读音都有自己的词语和例句，一看就懂！","tr":"Characters with more than one pronunciation are sorted out for you. Each pronunciation has its own words and example sentence. Easy to understand!","i":2,"c":null}]},{"t":"看、描、写三步骤","tt":"Watch, Trace, Write","pics":["char_top"],"lines":[{"w":"L","p":"l_think","t":"可是我最怕写字写错笔顺了……","tr":"But I'm afraid of writing the strokes in the wrong order...","i":0,"c":null},{"w":"D","p":"d_pencil","t":"不怕！先看笔顺动画，一笔一笔慢慢画给你看；再用手指描写淡淡的字；最后挑战不看字书写，写错三次还会给你提示。","tr":"Don't be! First watch the stroke-order animation, stroke by stroke. Then trace the light character with your finger. Finally, write it without looking. After three mistakes, you get a hint.","i":0,"c":null},{"w":"L","p":"l_clap","t":"看、描、写，三个步骤，字就牢牢记住了！","tr":"Watch, trace, write. Three steps, and the character sticks in my memory!","i":0,"c":null},{"w":"D","p":"d_good","t":"而且一边写，一边帮你数笔画哦！","tr":"And it counts the strokes for you as you write!","i":0,"c":null}]},{"t":"中英文一起学","tt":"Learn Chinese and English Together","pics":["SBS","I07"],"lines":[{"w":"L","p":"l_wow","t":"咦？迪诺，你一按右上角，怎么全部变成英文了？","tr":"Hey, Dino, you tapped the top right corner and everything turned into English!","i":0,"c":null},{"w":"D","p":"d_point","t":"这就是中英文切换！每个字都有英文意思，词语和例句也都有英文翻译，还可以用英文念出来。","tr":"That's the Chinese-English switch! Every character has an English meaning, every word and example sentence has an English translation, and they can be read aloud in English.","i":0,"c":null},{"w":"L","p":"l_yay","t":"所以学中文的时候，顺便也学会英文了！","tr":"So while I learn Chinese, I learn English too!","i":0,"c":null},{"w":"D","p":"d_proud","t":"没错！外国朋友想学中文也很容易，看英文就懂意思，再跟着中文发音学。一个App，两种语言，一起学！","tr":"That's right! It's easy for friends from other countries to learn Chinese too. Read the English to understand, then follow the Chinese pronunciation. One app, two languages, learning together!","i":1,"c":null}]},{"t":"练习室","tt":"The Practice Room","pics":["practice"],"lines":[{"w":"L","p":"l_ask","t":"学完以后，要怎么知道自己记住了没？","tr":"After I learn, how do I know if I remember?","i":0,"c":null},{"w":"D","p":"d_intro","t":"到练习室！小教练吹哨子，五种练习等你挑战：听音辨字、部首大考验、笔画数挑战、词句填空、听写测验。","tr":"Go to the Practice Room! The little coach blows the whistle, and five challenges are waiting: Listen and Pick, Radical Quiz, Stroke Count, Fill the Gap, and Dictation.","i":0,"c":null},{"w":"L","p":"l_think","t":"如果我常常答错同一个字呢？","tr":"What if I keep missing the same character?","i":0,"c":null},{"w":"D","p":"d_mag","t":"“弱点字特训”会把你常错的字找出来，专门帮你加强！","tr":"Practice Weak Characters finds the characters you often miss and helps you work on them!","i":0,"c":null}]},{"t":"五十四个主题游戏","tt":"Fifty-Four Theme Games","pics":["park","g_claw","g_dolphin","g_rocket","g_snowball","g_chest"],"lines":[{"w":"L","p":"l_ask","t":"乐园里面可以玩什么？","tr":"What can we play in the parks?","i":0,"c":null},{"w":"D","p":"d_intro","t":"每一座乐园都有六个主题游戏，九座加起来就是五十四个游戏！","tr":"Every park has six theme games. Nine parks together make fifty-four games!","i":0,"c":null},{"w":"L","p":"l_wow","t":"五十四个？！","tr":"Fifty-four?!","i":0,"c":null},{"w":"D","p":"d_point","t":"在糖果乐园用夹娃娃机夹部首、在海洋乐园跟海豚跳圈认字、在太空乐园发射火箭、在冰雪城堡打雪球大战、在海盗岛解开藏宝箱密码……每个游戏都有自己的故事哦！","tr":"Grab radicals with the claw machine in Candy Park, jump through hoops with the dolphins to read pinyin in Ocean Park, launch a rocket in Space Park, have a snowball fight at the Snow Castle, crack the treasure chest code on Pirate Island... Every game has its own story!","i":1,"c":["g_claw","g_dolphin","g_rocket","g_snowball","g_chest"]},{"w":"L","p":"l_yay","t":"一边玩一边练习，怎么玩都玩不腻！","tr":"Play and practice at the same time. I'll never get bored!","i":5,"c":null}]},{"t":"开口念出来","tt":"Say It Out Loud","pics":["g_egg","g_conch","g_aurora"],"lines":[{"w":"L","p":"l_wow","t":"咦？这个游戏怎么有麦克风？","tr":"Hey, why does this game have a microphone?","i":0,"c":null},{"w":"D","p":"d_mic","t":"每座乐园都有一个说话游戏！对着麦克风大声念，念对了，恐龙宝宝就会破壳而出、海螺会把声音传给海洋朋友、极光还会帮你实现愿望！","tr":"Every park has a speaking game! Read out loud into the microphone. Say it right, and a baby dinosaur hatches, the conch carries your voice to your ocean friends, and the aurora makes your wish come true!","i":0,"c":["g_egg","g_conch","g_aurora"]},{"w":"L","p":"l_clap","t":"原来连说话和发音都可以练习！","tr":"So I can practice speaking and pronunciation too!","i":2,"c":null}]},{"t":"完整的测验","tt":"A Full Test","pics":["test_intro","test_q","test_w","cert"],"lines":[{"w":"L","p":"l_ask","t":"那我想知道自己真正学得怎么样呢？","tr":"But how can I know how well I've really learned?","i":0,"c":null},{"w":"D","p":"d_intro","t":"每一集都有完整的测验！一共二十五题：十题四选一的选择题、十题填充题、五题写字题，每次都随机出题，不会一样。","tr":"Every volume has a full test! Twenty-five questions: ten four-choice questions, ten fill-in-the-blank questions and five writing questions, chosen at random so it's never the same.","i":1,"c":["test_q","test_w"]},{"w":"L","p":"l_think","t":"可以写上我的名字吗？","tr":"Can I write my name on it?","i":0,"c":null},{"w":"D","p":"d_good","t":"当然！考完会发给你一张奖状，写着“莉莉的成绩”，还有金牌、银牌、铜牌！","tr":"Of course! After the test you get a certificate that says Lily's Score, with a gold, silver or bronze medal!","i":3,"c":null},{"w":"L","p":"l_yay","t":"还有“总测验”，一到九集混在一起考，挑战最强的自己！","tr":"There's also a Big Test that mixes Volumes 1 to 9. I can challenge my best self!","i":3,"c":null}]},{"t":"错的字，一个都不漏","tt":"No Mistake Left Behind","pics":["records","detail","mistakes"],"lines":[{"w":"L","p":"l_think","t":"考错的题目怎么办？","tr":"What about the questions I got wrong?","i":0,"c":null},{"w":"D","p":"d_mag","t":"最近二十次的考试都会保留，按一下就能看到每一题、你的答案和正确答案。","tr":"Your last twenty tests are kept. Tap one to see every question, your answer and the right answer.","i":1,"c":null},{"w":"L","p":"l_ask","t":"那答错的字呢？","tr":"And the characters I got wrong?","i":2,"c":null},{"w":"D","p":"d_point","t":"全部收进“错误合集”！按一下那个字，马上回去重新学习。错过的字，一个都不会漏掉！","tr":"They all go into the Mistake Collection! Tap a character to go straight back and learn it again. Not one missed character gets left out!","i":2,"c":null}]},{"t":"成长观测站","tt":"My Report","pics":["report","radar"],"lines":[{"w":"L","p":"l_ask","t":"爸爸妈妈也想知道我学得怎么样耶！","tr":"Mom and Dad want to know how I'm doing too!","i":0,"c":null},{"w":"D","p":"d_book","t":"成长观测站有五力雷达图：字音辨识、部首判断、字形字义、词句运用、书写能力，哪里强、哪里要加强，一看就知道。","tr":"My Report has a five-skill radar chart: sound recognition, radicals, shapes and meaning, words and sentences, and writing. You can see what's strong and what needs work at a glance.","i":1,"c":null},{"w":"L","p":"l_giggle","t":"还有学会几个字、乐园星星和排行榜，好像在收集宝物一样！","tr":"Plus how many characters I've learned, park stars and a leaderboard. It's like collecting treasure!","i":0,"c":null}]},{"t":"随时随地都能学","tt":"Learn Anytime, Anywhere","pics":["DEV"],"lines":[{"w":"L","p":"l_think","t":"我用手机也可以玩吗？","tr":"Can I play on my phone too?","i":0,"c":null},{"w":"D","p":"d_good","t":"手机、平板、电脑都可以！直着拿、横着拿，画面都会自动变成最适合的样子，满满都是恐龙乐园。","tr":"Phones, tablets and computers all work! Hold it upright or sideways, and the screen changes to fit best, full of the Dinosaur Park.","i":0,"c":null}]},{"t":"听说读写，全部学会","tt":"Listen, Speak, Read and Write","pics":["I11","I08"],"lines":[{"w":"L","p":"l_yay","t":"迪诺，我懂了！听、说、读、写，在这里全部都可以学会！","tr":"Dino, I get it! Listening, speaking, reading and writing. I can learn them all here!","i":0,"c":null},{"w":"D","p":"d_proud const AUD={"zh-CN|N|乐园里的大宝藏":"audio/491e28f9a374.mp3","en-US|N|The Big Treasure in the Park":"audio/2b2240f95df4.mp3","zh-CN|L|迪诺迪诺！听说恐龙乐园里藏了一个超级大宝藏，是真的吗？":"audio/ba8c384df3a6.mp3","en-US|L|Dino, Dino! I heard there's a super big treasure hidden in the Dinosaur Park. Is it true?":"audio/e183bc9eb5ab.mp3","zh-CN|D|是真的！这个宝藏就叫做“迪诺文字大寻宝”！里面藏着三千六百多个中文字哦！":"audio/ad9f0c777b20.mp3","en-US|D|It's true! The treasure is called Dino's Word Treasure Hunt! More than 3,600 Chinese characters are hidden inside!":"audio/c0f9ed386852.mp3","zh-CN|L|三千六百多个？哇，那要怎么找啊？":"audio/6106f71d7755.mp3","en-US|L|More than 3,600? Wow, how do we find them?":"audio/12952e145c74.mp3","zh-CN|D|别担心，我带你一座乐园、一座乐园去寻宝！走吧！":"audio/a1bcb4eb314a.mp3","en-US|D|Don't worry. I'll take you on a treasure hunt, one park at a time. Let's go!":"audio/17675c64752f.mp3","zh-CN|N|九座乐园、九个级数":"audio/eeae8f5f85ee.mp3","en-US|N|Nine Parks, Nine Levels":"audio/a63bae7a607b.mp3","zh-CN|L|哇，这张藏宝地图好漂亮！":"audio/b1ad5a5a9ad7.mp3","en-US|L|Wow, what a beautiful treasure map!":"audio/36f1b4231de0.mp3","zh-CN|D|从一年级到九年级，一共分成九集，每一集就是一座主题乐园：糖果甜心乐园、海洋水上乐园、森林探险乐园、太空星际乐园、冰雪城堡乐园、丛林火山乐园、沙漠金字塔乐园、海盗宝藏岛，还有未来科技城！":"audio/d32381d7f9b1.mp3","en-US|D|From Grade 1 to Grade 9, there are nine volumes, and each volume is a theme park: Candy Sweet Park, Ocean Water Park, Forest Adventure Park, Space Star Park, Snow Castle Park, Jungle Volcano Park, Desert Pyramid Park, Pirate Treasure Island, and Future Tech City!":"audio/c67b1b368854.mp3","zh-CN|L|从糖果一路玩到未来科技，好像在环游世界耶！":"audio/4b473b1efa80.mp3","en-US|L|From candy all the way to future tech. It's like a trip around the world!":"audio/3e1a4ddd82e5.mp3","zh-CN|D|而且越往上走，字就越难，你会一级一级变得越来越厉害！":"audio/79624e37bf55.mp3","en-US|D|And the higher you go, the harder the characters get. You'll get better and better, level by level!":"audio/21c3a6443ba2.mp3","zh-CN|N|每个字都是一件宝物":"audio/6dd19ccf1213.mp3","en-US|N|Every Character Is a Treasure":"audio/ad33f09088dc.mp3","zh-CN|L|那找到一个字以后呢？":"audio/4e782fe22baf.mp3","e d English Together":"audio/771d9b563bc0.mp3","zh-CN|L|咦？迪诺，你一按右上角，怎么全部变成英文了？":"audio/6dd2e995eeef.mp3","en-US|L|Hey, Dino, you tapped the top right corner and everything turned into English!":"audio/ff55e5bde984.mp3","zh-CN|D|这就是中英文切换！每个字都有英文意思，词语和例句也都有英文翻译，还可以用英文念出来。":"audio/e574223e7ead.mp3","en-US|D|That's the Chinese-English switch! Every character has an English meaning, every word and example sentence has an English translation, and they can be read aloud in English.":"audio/cb44f306a31a.mp3","zh-CN|L|所以学中文的时候，顺便也学会英文了！":"audio/577934e0e473.mp3","en-US|L|So while I learn Chinese, I learn English too!":"audio/3a3ca51525ea.mp3","zh-CN|D|没错！外国朋友想学中文也很容易，看英文就懂意思，再跟着中文发音学。一个App，两种语言，一起学！":"audio/027d328902b3.mp3","en-US|D|That's right! It's easy for friends from other countries to learn Chinese too. Read the English to understand, then follow the Chinese pronunciation. One app, two languages, learning together!":"audio/fe62f6d53684.mp3","zh-CN|N|练习室":"audio/a19d87632d39.mp3","en-US|N|The Practice Room":"audio/7d4d9522a63f.mp3","zh-CN|L|学完以后，要怎么知道自己记住了没？":"audio/b4e93298153b.mp3","en-US|L|After I learn, how do I know if I remember?":"audio/11fc69bc6a3f.mp3","zh-CN|D|到练习室！小教练吹哨子，五种练习等你挑战：听音辨字、部首大考验、笔画数挑战、词句填空、听写测验。":"audio/93f54422b0e4.mp3","en-US|D|Go to the Practice Room! The little coach blows the whistle, and five challenges are waiting: Listen and Pick, Radical Quiz, Stroke Count, Fill the Gap, and Dictation.":"audio/82ed938d1adf.mp3","zh-CN|L|如果我常常答错同一个字呢？":"audio/74f65fe9c75c.mp3","en-US|L|What if I keep missing the same character?":"audio/fcf3d3f0a820.mp3","zh-CN|D|“弱点字特训”会把你常错的字找出来，专门帮你加强！":"audio/60eb001e69f5.mp3","en-US|D|Practice Weak Characters finds the characters you often miss and helps you work on them!":"audio/e7b9d4e0026f.mp3","zh-CN|N|五十四个主题游戏":"audio/d3a260d6f13a.mp3","en-US|N|Fifty-Four Theme Games":"audio/82db7f84f0c4.mp3","zh-CN|L|乐园里面可以玩什么？":"audio/dfdf781a0929.mp3","en-US|L|What can we play in the parks?":"audio/2980d9d61af4.mp3","zh-CN|D|每一  if(LAND){Object.assign(L,{left:"2%",height:"46%",bottom:"5%"});Object.assign(Dd,{left:"19%",height:"48%",bottom:"4%"})}else{Object.assign(L,{left:"4%",height:"25%",bottom:"3%"});Object.assign(Dd,{left:"50%",height:"26%",bottom:"2.5%"})}
 const s=$("sub").style;const fs=(LAND?h*0.052:w*0.062);s.fontSize=fs+"px";
 if(LAND)Object.assign(s,{left:"37%",right:"2%",top:"auto",bottom:"7%"});else Object.assign(s,{left:"4%",right:"4%",top:"55%",bottom:"auto"});
 $("ttl").style.fontSize=(LAND?h*0.042:w*0.05)+"px";
 if(!started)$("start").style.backgroundImage=`url(${IMG[LAND?"I01":"I02"]})`;
 setScene(curScene)}
addEventListener("resize",layout);
/* ---------- scenes ---------- */
let curScene=null;
function setScene(k){curScene=k;const sc=$("scene");if(k&&SCENE[k]){sc.style.backgroundImage=`url(${IMG[SCENE[k][LAND?0:1]]})`;sc.classList.add("on");$("frame").style.opacity=0;show(false)}else{sc.classList.remove("on");$("frame").style.opacity=1;show(true)}}
function show(v){$("cL").style.display=$("cD").style.display=v?"":"none"}
function pic(k){if(SCENE.hasOwnProperty(k)&&SCENE[k]){setScene(k);return}setScene(null);$("frame").innerHTML=`<img src="${IMG[k]}">`}
function pose(who,p){const el=$(who==="L"?"cL":"cD");if(p)el.querySelector("img").src=IMG[p];el.classList.remove("hop");void el.offsetWidth;el.classList.add("hop");setTimeout(()=>el.classList.remove("hop"),460)}
function talk(who){["L","D"].forEach(k=>{const el=$("c"+k);const on=who===k||who==="B";el.classList.toggle("talk",on);el.classList.toggle("idle",!on);el.classList.toggle("dim",!on&&who!=="")})}
/* ---------- player ---------- */
let si=0,run=0,paused=false,started=false,idle=true,ended=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitPause(id){while(paused&&id===run)await sleep(150)}
function dots(){$("dots").innerHTML=SEGS.map((s,i)=>`<i class="${i===si?"on":""}"></i>`).join("")}
async function playFrom(i){const id=++run;idle=false;ended=false;stopAll();paused=false;$("bPlay").textContent="⏸";
 for(si=i;si<SEGS.length;si++){if(id!==run)return;dots();const sg=SEGS[si];preSeg(si);preSeg(si+1);
  pic(sg.pics[0]);$("cL").querySelector("img").src=IMG.l_ask;$("cD").querySelector("img").src=IMG.d_intro;talk("");
  const tt=$("ttl");tt.innerHTML=`<small>${U.part.replace("{n}",si+1)}</small>${sg.t}<span class="tr">${sg.tt}</span>`;tt.classList.add("big");$("sub").innerHTML="";
  await say(sg.t,"N");await sleep(500);tt.classList.remove("big");await sleep(500);if(id!==run)return;
  for(const ln of sg.lines){await waitPause(id);if(id!==run)return;
   if(!ln.c)pic(sg.pics[ln.i]||sg.pics[0]);
   if(ln.w==="B"){pose("L","l_yay");pose("D","d_bye")}else pose(ln.w,ln.p);talk(ln.w);
   const cs=chunks(ln.t);const LK=U.lang+"|"+ln.w+"|"+ln.t,LA=AUD[LK],LC=CUE[LK]||[];
   if(LA&&LC.length===cs.length-1){const showK=k=>{if(ln.c)pic(ln.c[Math.min(k,ln.c.length-1)]);$("sub").innerHTML=`<b class="${ln.w}">${U[ln.w]}</b>${cs[k]}<span class="tr">${ln.tr}</span>`};let k=0;showK(0);const tm=setInterval(()=>{while(k<LC.length&&AEL.currentTime>=LC[k]){k++;showK(k)}},50);await playA(LA);clearInterval(tm);if(id!==run)return;await sleep(120)}else for(let k=0;k<cs.length;k++){await waitPause(id);if(id!==run)return;if(ln.c)pic(ln.c[Math.min(k,ln.c.length-1)]);
    $("sub").innerHTML=`<b class="${ln.w}">${U[ln.w]}</b>${cs[k]}<span class="tr">${ln.tr}</span>`;await say(cs[k],ln.w);if(id!==run)return;await sleep(120)}
   talk("");await sleep(350)}
  await sleep(700)}
 if(id!==run)return;$("sub").innerHTML=`<b class="B">${U.B}</b>${U.end}`;setScene("I08");say(U.end,"B");idle=true;ended=true;
 $("start").style.display="flex";$("start").style.backgroundImage=`url(${IMG.I08})`;$("go").textContent="⟲ "+U.again}
$("go").onclick=()=>{started=true;$("start").style.display="none";playFrom(0)};
$("bPlay").onclick=()=>{if(started&&idle&&!ended){playFrom(si);return}paused=!paused;$("bPlay").textContent=paused?"▶":"⏸";try{if(acur){if(paused)AEL.pause();else{const p=AEL.play();if(p&&p.catch)p.catch(()=>{})}}}catch(e){}};
$("bNext").onclick=()=>{if(si<SEGS.length-1)playFrom(si+1)};$("bPrev").onclick=()=>playFrom(Math.max(0,si-1));
/* ---------- reading ---------- */
function buildRead(){let h=`<div class="rhead" style="background-image:url(${IMG.I01})"><h1>${U.title}</h1><h2>${U.sub}</h2></div><div class="rbar"><button class="big" id="toAnim">▶ ${U.anim}</button><button class="big pk" id="trR">${U.trl}</button></div>`;
 SEGS.forEach((sg,i)=>{const ps=[...new Set([].concat(sg.pics,...sg.lines.map(l=>l.c||[])))];
  h+=`<div class="seg"><div class="card"><h3><span class="n">${U.part.replace("{n}",i+1)}</span><span>${sg.t}<em>${sg.tt}<i data-tt="${i}">🔊</i></em></span><button data-s="${i}">🔊 ${U.readseg}</button></h3><div class="pics">${ps.map(p=>`<img src="${IMG[p]}">`).join("")}</div><div class="dl">${sg.lines.map((l,j)=>`<div class="ln ${l.w}"><img class="av" src="${IMG[l.w==="B"?"l_yay":l.p]}"><div class="bb" data-s="${i}" data-l="${j}"><b>${U[l.w]}</b>${l.t}<div class="t">${l.tr}<i data-t="${i}-${j}">🔊</i></div></div></div>`).join("")}</div></div></div>`});
 $("read").innerHTML=h;$("toAnim").onclick=()=>{document.body.classList.remove("reading");stopAll();if(started&&idle&&!ended)playFrom(si)};
 let rid=0;const rd=async(list,ts)=>{const id=++rid;stopAll();if(ts!=null){await say(SEGS[ts].t,"N");if(id!==rid)return;await sleep(250)}for(const el of list){if(id!==rid)return;const l=SEGS[+el.dataset.s].lines[+el.dataset.l];el.classList.add("say");if(AUD[U.lang+"|"+l.w+"|"+l.t])await say(l.t,l.w);else for(const c of chunks(l.t)){if(id!==rid)break;await say(c,l.w)}el.classList.remove("say")}};
 $("read").querySelectorAll(".bb").forEach(b=>b.onclick=e=>{if(e.target.dataset.t){rid++;const [a,c]=e.target.dataset.t.split("-");sayT(SEGS[+a].lines[+c].tr,SEGS[+a].lines[+c].w);return}rd([b])});$("trR").onclick=togTr;
 $("read").querySelectorAll("h3 button").forEach(b=>b.onclick=()=>rd([...$("read").querySelectorAll(`.bb[data-s="${b.dataset.s}"]`)],+b.dataset.s));$("read").querySelectorAll("h3 em i").forEach(b=>b.onclick=()=>{rid++;sayT(SEGS[+b.dataset.tt].tt,"N")})}
function toRead(){run++;idle=true;stopAll();document.body.classList.add("reading");scrollTo(0,0)}
$("goRead").onclick=toRead;$("bRead").onclick=toRead;
$("start").querySelector("h1").innerHTML=U.title;$("start").querySelector("h2").textContent=U.sub;$("go").textContent="▶ "+U.watch;$("goRead").textContent="📖 "+U.read;$("bRead").textContent="📖 "+U.read;
function togTr(){const on=document.body.classList.toggle("tron");try{localStorage.setItem("dinoTr",on?1:0)}catch(e){}[$("bTr"),$("trR")].forEach(b=>{b.classList.toggle("on",on);b.textContent=(on?"✓ ":"")+U.trl})}
$("bTr").onclick=togTr;
buildRead();layout();dots();togTr();togTr();
if(location.hash==="#read")document.body.classList.add("reading");
</script>
</body>
