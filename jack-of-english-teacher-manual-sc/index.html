<!DOCTYPE html>
<html lang="sc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jack-of-English 教师手册</title>
<style>
:root{--g:#0fa34f;--g2:#087a3a;--g3:#e7f6ec;--y:#ffc531;--y2:#fff4d1;--ink:#1b2a22;--mut:#5d6f65;--bg:#f2f6f3;--card:#fff;--line:#e2ebe5;--fs:16px;--r:18px;--sh:0 6px 20px rgba(20,60,35,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC","Microsoft JhengHei","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(120deg,var(--g2),var(--g));color:#fff;box-shadow:0 3px 14px rgba(0,60,25,.25)}
#top .logo{width:38px;height:38px;border-radius:12px;background:var(--y);color:#0a5a2c;display:grid;place-items:center;font-weight:900;font-size:15px;letter-spacing:-.5px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
#top .tt{flex:1;min-width:0;line-height:1.2}
#top .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tt small{opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tb{height:36px;min-width:36px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;flex:none}
.tb:active{transform:scale(.96)}
.tb.on{background:var(--y);color:#0a5a2c}
#app{max-width:1500px;margin:0 auto}
/* home */
.hero{margin:18px 16px 6px;padding:26px 26px 22px;border-radius:26px;background:radial-gradient(120% 140% at 100% 0%,#ffe27a 0%,#ffc531 30%,#13a653 31%,#0a7f3c 100%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:clamp(24px,3.4vw,36px);line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.hero p{margin:8px 0 0;opacity:.95;font-size:15px}
.hero .big{position:absolute;right:22px;bottom:-26px;font-size:120px;font-weight:900;opacity:.14;letter-spacing:-6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px}
.lv{position:relative;border-radius:22px;padding:18px 18px 16px;color:#fff;min-height:150px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s;display:flex;flex-direction:column}
.lv:active{transform:scale(.97)}
.lv .n{font-size:46px;font-weight:900;line-height:1;letter-spacing:-2px}
.lv .n small{font-size:18px;letter-spacing:0;margin-left:2px;opacity:.9}
.lv .l{font-weight:800;font-size:15px;margin-top:6px}
.lv .ltp{font-size:12.5px;opacity:.92;margin-top:4px;line-height:1.4;flex:1}
.lv .cv{margin-top:8px;height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}
.lv .cv i{display:block;height:100%;background:#fff}
.lv .ct{font-size:11.5px;opacity:.9;margin-top:4px}
.lv:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
/* volume layout */
.vol{display:flex;gap:0;min-height:calc(100vh - 58px)}
.side{width:290px;flex:none;border-right:1px solid var(--line);background:#fbfdfb;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:12px 10px 40px}
.main{flex:1;min-width:0;padding:16px 18px 80px}
.side h4{margin:14px 8px 6px;font-size:12.5px;color:var(--mut);letter-spacing:.5px}
.si{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14.5px;line-height:1.3}
.si:hover{background:var(--g3)}
.si.on{background:var(--g);color:#fff}
.si .no{width:30px;height:30px;border-radius:9px;background:var(--g3);color:var(--g2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.si.on .no{background:rgba(255,255,255,.25);color:#fff}
.si .tx{flex:1;min-width:0}
.si .tx small{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-rev{background:#3b82f6}.d-test{background:#ef4444}.d-act{background:#f59e0b}
@media (max-width:899px){.side{display:none}.vol.list .side{display:block;width:100%;position:static;height:auto;border:0;background:none}.vol.list .main{display:none}}
.srch{display:flex;gap:8px;margin:4px 4px 8px}
.srch input{flex:1;min-width:0;height:40px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:14.5px;background:#fff}
.srch input:focus{outline:none;border-color:var(--g)}
/* overview */
.vh{border-radius:24px;padding:22px 24px;color:#fff;box-shadow:var(--sh);position:relative;overflow:hidden}
.vh h2{margin:0;font-size:clamp(22px,3vw,30px)}
.vh p{margin:6px 0 0;opacity:.92}
.vh .big{position:absolute;right:20px;top:-14px;font-size:110px;font-weight:900;opacity:.15}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.cc{background:var(--card);border-radius:18px;padding:14px 15px;box-shadow:var(--sh);border:1.5px solid transparent;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.cc:hover{border-color:var(--g)}
.cc:active{transform:scale(.98)}
.cc .h{display:flex;align-items:center;gap:10px}
.cc .num{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.cc .ti{font-weight:800;font-size:15.5px;line-height:1.25}
.cc .ti small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.cc .tps{font-size:13.5px;color:var(--ink);line-height:1.45}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px}
.b-rev{background:#e0edff;color:#1d4ed8}.b-test{background:#fee2e2;color:#b91c1c}.b-act{background:#fef3c7;color:#b45309}
.min{font-size:12px;color:var(--mut)}
.sh2{margin:24px 2px 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.sh2:before{content:"";width:6px;height:22px;border-radius:4px;background:var(--y)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.gi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);font-weight:700;display:flex;gap:10px;align-items:center}
.gi i{font-style:normal;font-size:20px}
/* class page */
.ch{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ch .num{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:28px;flex:none;box-shadow:0 6px 14px rgba(15,163,79,.35)}
.ch .inf{flex:1;min-width:200px}
.ch h2{margin:0;font-size:clamp(20px,2.6vw,26px);line-height:1.2}
.ch .tps{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--y2);color:#7a5600;border-radius:20px;padding:3px 11px;font-size:13px;font-weight:700}
.nav2{display:flex;gap:8px}
.nb{height:40px;padding:0 14px;border-radius:12px;background:var(--g3);color:var(--g2);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.nb[disabled]{opacity:.35;pointer-events:none}
.flow{display:flex;gap:4px;overflow-x:auto;margin:14px 0 4px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.flow button{flex:1 1 0;min-width:86px;padding:9px 8px;font-size:12.5px;line-height:1.25;color:#fff;text-align:left;font-weight:700}
.flow button small{display:block;font-weight:500;opacity:.9}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-top:16px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .hd .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.card .hd h3{margin:0;font-size:1.08em;line-height:1.3;flex:1}
.card .hd h3 small{display:block;font-size:12.5px;color:var(--mut);font-weight:500}
.tp{background:var(--y);color:#5a4100;border-radius:20px;padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap;flex:none}
.bd{padding:12px 18px 16px}
.goal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.gf{background:var(--g3);border-radius:14px;padding:10px 13px}
.gf .lb{font-size:12.5px;font-weight:800;color:var(--g2);letter-spacing:.3px;margin-bottom:2px}
.gf .vv{font-size:.95em}
.gf .vv p{margin:2px 0}
h4.s3{margin:16px 0 6px;font-size:1em;color:var(--g2);display:flex;align-items:center;gap:8px}
h4.s3:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--g)}
.pp{margin:6px 0}
.li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.li .k{flex:none;min-width:28px;height:24px;padding:0 6px;border-radius:8px;background:var(--g3);color:var(--g2);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:2px}
.li .v{flex:1;min-width:0}
.dl{display:flex;gap:8px;margin:5px 0 5px 4px;align-items:flex-start}
.dl .sp{flex:none;min-width:34px;padding:1px 7px;border-radius:9px;font-size:12.5px;font-weight:800;text-align:center;margin-top:3px;color:#fff;background:#8b5cf6}
.dl .sp.t{background:var(--g)}.dl .sp.s{background:#3b82f6}.dl .sp.c{background:#f59e0b}
.dl .bb{background:#f6f8fb;border:1px solid #e6ebf2;border-radius:4px 14px 14px 14px;padding:5px 12px;font-family:Georgia,"Times New Roman",serif;font-size:1.02em;line-height:1.5}
.en{display:none;color:#6b7c72;font-size:.88em;font-style:italic;margin-top:2px;border-left:3px solid var(--line);padding-left:8px}
body.sen .en{display:block}
.dtg{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:#f0f7ff;border:1px dashed #9cc3f5;border-radius:12px;padding:8px 10px;margin:4px 0 10px;font-size:12.5px;color:#1d4ed8}
.dtg b{margin-right:4px}
.dtg span{background:#fff;border-radius:7px;padding:1px 7px;border:1px solid #dbe8fb}
.dtg i{font-style:normal;opacity:.5}
.pg{display:block;width:100%;border-radius:12px;box-shadow:var(--sh);margin:10px 0;background:#fff;cursor:zoom-in}
details.op{margin-top:16px}
details.op summary{cursor:pointer;font-weight:800;color:var(--g2);padding:10px 4px}
#zoom{position:fixed;inset:0;background:rgba(10,20,15,.92);z-index:50;display:none;overflow:auto}
#zoom img{width:min(1600px,190vw);display:block;margin:0 auto}
#zoom .x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:#fff;font-size:22px;font-weight:900;z-index:51}
.note{background:var(--y2);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-size:14px;color:#7a5600}
.sr{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:var(--sh)}
.sr b{color:var(--g2)}
.sr mark{background:#fff0a8}
.mobl{display:none}
@media (max-width:899px){.mobl{display:inline-flex}.main{padding:12px 12px 80px}.bd{padding:10px 14px 14px}.card .hd{padding:12px 14px}}
.empty{color:var(--mut);padding:30px;text-align:center}
.say{position:relative;border-radius:10px;transition:background .2s}
.say.speaking{background:#fff6c9;box-shadow:0 0 0 3px #ffe07a}
.sb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--g3);color:var(--g2);font-size:13px;vertical-align:middle;margin-left:6px;flex:none;opacity:.85}
.sb:hover{opacity:1;background:var(--g);color:#fff}
.pa{height:32px;padding:0 12px;border-radius:10px;background:var(--g);color:#fff;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:4px;flex:none}
.pa.on{background:#ef4444}
/* login */
body.locked #top,body.locked #app{display:none}
#login{display:none;position:fixed;inset:0;z-index:100;overflow:auto;padding:24px 16px;background:radial-gradient(120% 90% at 100% 0%,#ffe27a 0%,#ffc531 22%,#13a653 23%,#0a7f3c 100%)}
body.locked #login{display:grid;place-items:center}
.lgc{width:100%;max-width:400px;background:#fff;border-radius:26px;padding:30px 26px 26px;box-shadow:0 20px 50px rgba(0,50,20,.35);font-size:16px}
.lgc .logo{width:60px;height:60px;border-radius:18px;background:var(--y);color:#0a5a2c;display:grid;place-items:center;font-weight:900;font-size:24px;letter-spacing:-1px;margin:0 auto 12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lgc h1{margin:0;text-align:center;font-size:22px;line-height:1.25}
.lgc .sub{margin:4px 0 20px;text-align:center;color:var(--mut);font-size:14px}
.lgc label.f{display:block;font-size:13.5px;font-weight:800;color:var(--g2);margin:14px 2px 6px}
.lgc .in{position:relative}
.lgc input[type=text],.lgc input[type=password]{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#f8fbf9}
.lgc input:focus{outline:none;border-color:var(--g);background:#fff;box-shadow:0 0 0 4px rgba(15,163,79,.14)}
.lgc #lp{padding-right:52px}
.lgc .eye{position:absolute;right:4px;top:4px;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--mut)}
.lgc .eye:hover,.lgc .eye:focus-visible{background:var(--g3);color:var(--g2);outline:none}
.lgc .eye svg{width:22px;height:22px}
.lgc .eye .e2,.lgc .eye.on .e1{display:none}.lgc .eye.on .e2{display:block}
.lgc .rm{display:flex;align-items:center;gap:9px;margin:16px 2px 0;font-size:14.5px;cursor:pointer;user-select:none}
.lgc .rm input{width:19px;height:19px;accent-color:var(--g);margin:0;flex:none}
.lgc .err{min-height:22px;margin:10px 2px 0;color:#c62828;font-size:14px;font-weight:700}
.lgc .go{width:100%;height:52px;margin-top:6px;border-radius:15px;background:linear-gradient(120deg,var(--g2),var(--g));color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 18px rgba(15,163,79,.35)}
.lgc .go:active{transform:scale(.98)}
.lgc.shake{animation:lgs .35s}
@keyframes lgs{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.lgc.shake{animation:none}}
</style>
</head>
